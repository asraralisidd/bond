services:
  db:
    image: postgres:16-alpine
    container_name: bond-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bond_dev}
      POSTGRES_USER: ${POSTGRES_USER:-bond}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bond_dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bond-pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bond} -d ${POSTGRES_DB:-bond_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bond-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bond}:${POSTGRES_PASSWORD:-bond_dev_password_change_me}@db:5432/${POSTGRES_DB:-bond_dev}
      CORS_ORIGIN: http://localhost:5173
      # Midnight configuration passthrough (Phase 14). Empty defaults
      # preserve local SIMULATED behavior; production deployments set
      # these explicitly (MIDNIGHT_NETWORK is required in production).
      # No secrets here — endpoints and contract address are public.
      MIDNIGHT_NETWORK: ${MIDNIGHT_NETWORK:-}
      MIDNIGHT_INDEXER_HTTP: ${MIDNIGHT_INDEXER_HTTP:-}
      MIDNIGHT_INDEXER_WS: ${MIDNIGHT_INDEXER_WS:-}
      MIDNIGHT_NODE_URL: ${MIDNIGHT_NODE_URL:-}
      PROOF_SERVER_URL: ${PROOF_SERVER_URL:-}
      BOND_CONTRACT_ADDRESS: ${BOND_CONTRACT_ADDRESS:-}
      BOND_ZK_ASSETS_PATH: ${BOND_ZK_ASSETS_PATH:-}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Required: the production API origin baked into the bundle.
      # Empty/unset fails the image build by design (never localhost).
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set (e.g. in .env) to build the web image}
    container_name: bond-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  bond-pgdata:
