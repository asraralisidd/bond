name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bond_dev
          POSTGRES_USER: bond
          POSTGRES_PASSWORD: bond_dev_password_change_me
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U bond -d bond_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_PASSWORD: bond_dev_password_change_me
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Python SDK and demo tests
        run: |
          pip install pytest httpx
          PYTHONPATH=sdks/python python -m pytest sdks/python/tests sdks/demo/tests -q

      - name: API image build
        run: docker build -f apps/api/Dockerfile -t bond-api:ci .

      - name: Dependency audit (production only)
        run: npm audit --omit=dev
