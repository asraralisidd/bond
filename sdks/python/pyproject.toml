[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bond-sdk"
version = "0.1.0"
description = "Framework-free Python SDK for the BOND agent security and collateral protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
# Optional framework adapters. The core SDK never imports these;
# adapter modules are duck-typed and importable without them.
# [VERIFY-LANGGRAPH]: no LangGraph version has been verified in this
# environment (not installed, no live wallet/network). Declare only a
# lower bound once a version is exercised against these tests; until
# then install "langgraph" separately at your own verified version.
# langgraph = ["langgraph>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["bond_sdk"]
