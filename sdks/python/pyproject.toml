[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bond-sdk"
version = "0.1.0"
description = "Framework-free Python SDK for the BOND agent security and collateral protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["bond_sdk"]
